[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rakeglossary"
version = "0.1.0"
description = "Automated glossary generator from books and documents (EN -> FA)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "RakeGlossary" }]

dependencies = [
    # --- Core web/API ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "python-multipart>=0.0.12",

    # --- Database ---
    "sqlalchemy>=2.0",
    "alembic>=1.13",

    # --- Document extraction ---
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12",
    "charset-normalizer>=3.4",

    # --- NLP ---
    "spacy>=3.8",
    "rake-nltk>=1.0.6",
    "nltk>=3.9",
    "yake>=0.4.8",   # سبک، رایگان، بدون مدل حجیم

    # --- Definitions ---
    "httpx>=0.27",

    # --- Translation ---
    "deep-translator>=1.11",
    "diskcache>=5.6",

    # --- Logging ---
    "loguru>=0.7",

    # --- Optional LLM ---
    "openai>=1.50",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.7",
    "black>=24.10",
    "mypy>=1.13",
    "argostranslate>=1.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
namespace_packages = true
mypy_path = "."
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true